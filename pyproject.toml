[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyquadwild"
version = "0.1.0"
description = "A Python wrapper for the QuadWild + Bi-MDF C++ quad-remeshing pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "trimesh[easy]>=4.0",
    "numpy>=1.24",
    "scipy>=1.10"
]

[tool.setuptools]
packages = ["pyquadwild"]

[tool.setuptools.package-data]
pyquadwild = ["libs/*", "config/**/*.json", "config/**/*.txt"]
